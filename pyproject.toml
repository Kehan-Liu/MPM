[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taichi-mpm-lab"
version = "0.1.0"
description = "Coupled fluid/solid/cloth MLS-MPM sandbox built with Taichi"
requires-python = ">=3.10"
dependencies = [
    "taichi>=1.7.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
